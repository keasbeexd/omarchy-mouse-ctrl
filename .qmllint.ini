; Widget-level QML of this plugin -- like the Omarchy shell's own widget
; code (plugins/bar/widgets -- Bar.qml alone lints with 229 of the same) --
; idiomatically references the shell context unqualified: Style.x, Util.x,
; hsk.x, parent.x. The reference is idiomatic to this ecosystem, not a
; defect, and qualifying it would mean injecting dozens of ids and a
; ComponentBehavior: Bound sweep across user-verified UI for zero
; behavioral change.
;
; With UnqualifiedAccess silenced, the remaining qmllint output is the
; gate: today exactly ONE known false positive stands --
;   Panel.qml:993 Member "field" not found [missing-property]
; a Loader whose sourceComponent is one of four widget variants
; (rowToggle/rowSlider/rowChips/rowColor), each of which declares
; `property string field`; qmllint cannot type the polymorphic item.
; Any other warning appearing here is a regression.
[Warnings]
UnqualifiedAccess=disable
