; The plugin's QML, like the Omarchy shell's own panels, reads outer ids from
; delegates unqualified (root.x inside a Repeater); qualifying them would mean
; required-property plumbing through every delegate for no behavioral change.
;
; Remaining known noise: Style.font.* and Style.bar.* report missing-property
; because qmllint types Style's nested objects as plain QObject. Anything else
; qmllint reports is a regression.
[Warnings]
UnqualifiedAccess=disable
